<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beefree SDK demo</title>
    <link rel="icon" href="data:," />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #1f2933; background: #f5f7fa; }
      body { display: flex; flex-direction: column; }
      header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #ffffff; border-bottom: 1px solid #d9e2ec; }
      header h1 { font-size: 16px; margin: 0 16px 0 0; }
      button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #9fb3c8; background: #ffffff; cursor: pointer; }
      button.primary { background: #7a3cf5; border-color: #7a3cf5; color: #ffffff; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { margin-left: auto; font-size: 13px; color: #52606d; }
      #status.error { color: #b91c1c; font-weight: 600; }
      /* The builder fills its container. The container must have a real height. */
      #beefree-sdk-container { flex: 1 1 auto; min-height: 480px; }
      #output { height: 300px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: #d9e2ec; border-top: 1px solid #d9e2ec; }
      #output section { display: flex; flex-direction: column; background: #ffffff; min-width: 0; }
      #output h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; margin: 0; padding: 8px 12px; color: #52606d; border-bottom: 1px solid #e4ebf2; }
      #output pre { flex: 1; margin: 0; padding: 10px 12px; overflow: auto; font-size: 12px; line-height: 1.4; white-space: pre-wrap; word-break: break-all; }
      #output iframe { flex: 1; border: 0; width: 100%; }
      .hint { color: #829ab1; }
    </style>
  </head>
  <body>
    <header>
      <h1>Beefree SDK demo</h1>
      <button id="save" class="primary" disabled>Save</button>
      <button id="preview" disabled>Preview</button>
      <span id="status">Starting…</span>
    </header>

    <div id="beefree-sdk-container"></div>

    <div id="output">
      <section>
        <h2>Template JSON (onSave)</h2>
        <pre id="json-output" class="hint">Click Save to see the template JSON here.</pre>
      </section>
      <section>
        <h2>HTML (onSave)</h2>
        <pre id="html-output" class="hint">Click Save to see the rendered HTML here.</pre>
      </section>
      <section>
        <h2>HTML preview</h2>
        <iframe id="html-preview" title="Rendered HTML preview" sandbox=""></iframe>
      </section>
    </div>

    <!-- Beefree SDK loader. Defines the global BeePlugin. Keep it before app.js. -->
    <script src="https://app-rsrc.getbee.io/plugin/v2/BeePlugin.js"></script>
    <!-- auth.js defines getBeefreeToken(uid). Copy one variant from ../auth/ to this folder. -->
    <script src="auth.js"></script>
    <!-- token-claims.js reads the application type from the token: File Manager credentials go to file-manager.html. -->
    <script src="token-claims.js"></script>
    <script src="app.js"></script>
  </body>
</html>
